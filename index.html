<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlockWorld</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ==================================================
         GAME
    =================================================== -->

    <canvas id="game"></canvas>


    <!-- ==================================================
         HOTBAR
    =================================================== -->

    <div id="hotbar">


        <!-- GRASS -->

        <div class="hotbar-slot selected">

            <div class="item-icon grass-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- DIRT -->

        <div class="hotbar-slot">

            <div class="item-icon dirt-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- STONE -->

        <div class="hotbar-slot">

            <div class="item-icon stone-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- WOOD -->

        <div class="hotbar-slot">

            <div class="item-icon wood-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- LEAVES -->

        <div class="hotbar-slot">

            <div class="item-icon leaves-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- PLANKS -->

        <div class="hotbar-slot">

            <div class="item-icon planks-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- CRAFTING TABLE -->

        <div class="hotbar-slot">

            <div class="item-icon crafting-table-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- EMPTY -->

        <div class="hotbar-slot">

            <div class="item-icon"></div>

            <span class="item-amount"></span>

        </div>


        <!-- EMPTY -->

        <div class="hotbar-slot">

            <div class="item-icon"></div>

            <span class="item-amount"></span>

        </div>


    </div>


    <!-- ==================================================
         CROSSHAIR
    =================================================== -->

    <div id="crosshair">
        +
    </div>


    <!-- ==================================================
         NORMAL 2x2 CRAFTING MENU
    =================================================== -->

    <div id="craftingMenu">

        <div class="crafting-window">

            <h2>Crafting</h2>


            <div class="crafting-content">

                <div class="crafting-grid">

                    <button
                        class="crafting-slot"
                        id="crafting-slot-0"
                        data-slot="0"
                    ></button>

                    <button
                        class="crafting-slot"
                        id="crafting-slot-1"
                        data-slot="1"
                    ></button>

                    <button
                        class="crafting-slot"
                        id="crafting-slot-2"
                        data-slot="2"
                    ></button>

                    <button
                        class="crafting-slot"
                        id="crafting-slot-3"
                        data-slot="3"
                    ></button>

                </div>


                <div class="crafting-arrow">
                    →
                </div>


                <button
                    id="crafting-result"
                ></button>

            </div>


            <p>
                Press C to close
            </p>

        </div>

    </div>


    <!-- ==================================================
         3x3 CRAFTING TABLE MENU
    =================================================== -->

    <div id="tableCraftingMenu">

        <div class="crafting-window table-window">

            <h2>Crafting Table</h2>


            <div class="table-crafting-content">

                <div class="table-crafting-grid">

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-0"
                        data-slot="0"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-1"
                        data-slot="1"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-2"
                        data-slot="2"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-3"
                        data-slot="3"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-4"
                        data-slot="4"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-5"
                        data-slot="5"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-6"
                        data-slot="6"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-7"
                        data-slot="7"
                    ></button>

                    <button
                        class="table-crafting-slot"
                        id="table-crafting-slot-8"
                        data-slot="8"
                    ></button>

                </div>


                <div class="crafting-arrow">
                    →
                </div>


                <button
                    id="table-crafting-result"
                ></button>

            </div>


            <p>
                Press C to close
            </p>

        </div>

    </div>


    <!-- ==================================================
         INSTRUCTIONS
    =================================================== -->

    <div id="instructions">

        <b>BlockWorld</b>

        <br>
        <br>

        WASD — Move

        <br>

        SPACE — Jump

        <br>

        Mouse — Look around

        <br>

        ESC — Release mouse

    </div>


    <!-- ==================================================
         START SCREEN
    =================================================== -->

    <div id="startScreen">

        <div class="startBox">

            <h1>
                BlockWorld
            </h1>

            <p>
                A tiny Minecraft-inspired browser game.
            </p>

            <button id="startButton">

                START GAME

            </button>

        </div>

    </div>


    <!-- ==================================================
         THREE.JS
    =================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
    ></script>


    <!-- ==================================================
         BLOCKWORLD JAVASCRIPT
    =================================================== -->

<script src="js/blocks.js"></script>
<script src="js/world.js"></script>
<script src="js/blockvisuals.js"></script>
<script src="js/ores.js"></script>
<script src="js/orevisuals.js"></script>
<script src="js/culling.js"></script>
<script src="js/chunks.js"></script>
<script src="js/player.js"></script>
<script src="js/controls.js"></script>
<script src="js/mining.js"></script>
<script src="js/cracks.js"></script>
<script src="js/inventory.js"></script>
<script src="js/crafting.js"></script>
<script src="js/daynight.js"></script>
<script src="js/main.js"></script>


</body>

</html>
