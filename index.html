<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BlockWorld</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}
#game{position:fixed;inset:0;width:100%;height:100%}
#startScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(20,80,130,.75),rgba(20,40,70,.9))}
.startBox{width:min(90%,600px);padding:45px 30px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 20px 60px #0006}
.startBox h1{font-size:60px;color:#4caf50;text-shadow:3px 3px #2e7d32;margin-bottom:15px}
.startBox p{color:#555;font-size:18px;line-height:1.6;margin-bottom:30px}
#startButton{border:0;padding:16px 55px;font-size:24px;font-weight:bold;color:#fff;background:#4caf50;border-radius:10px;cursor:pointer;box-shadow:0 6px #2e7d32}
#startButton:active{transform:translateY(5px);box-shadow:0 1px #2e7d32}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#crosshair:before{left:9px;top:0;width:2px;height:20px}
#crosshair:after{left:0;top:9px;width:20px;height:2px}
#help,#blockInfo{position:absolute;padding:12px 16px;color:#fff;background:#0008;border-radius:8px;font-size:14px;line-height:1.5}
#help{top:15px;left:15px}
#blockInfo{top:15px;right:15px}
#message{position:absolute;top:80px;left:50%;transform:translate(-50%,-15px);padding:10px 20px;color:#fff;background:#000b;border-radius:20px;opacity:0;transition:.2s}
#message.show{opacity:1;transform:translate(-50%,0)}
#breakingText{position:absolute;left:50%;top:calc(50% + 25px);transform:translateX(-50%);color:#fff;text-shadow:2px 2px 3px #000;opacity:0}
#breakingText.show{opacity:1}
#hotbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#0008;border-radius:10px;pointer-events:auto}
.slot{width:65px;height:65px;position:relative;display:flex;align-items:center;justify-content:center;border:3px solid #777;background:#1e1e1ecc;border-radius:5px;cursor:pointer}
.slot.selected{border-color:#fff;box-shadow:0 0 0 2px #ffd54f}
.preview{width:38px;height:38px;border:2px solid #0005}
.number{position:absolute;bottom:2px;left:5px;color:#fff;font-size:12px;text-shadow:1px 1px 2px #000}
.amount{position:absolute;right:5px;bottom:3px;color:#fff;font-size:16px;font-weight:bold;text-shadow:2px 2px 2px #000}
#reset{position:absolute;right:20px;bottom:105px;pointer-events:auto;padding:9px 14px;border:0;border-radius:7px;color:#fff;background:#0009;cursor:pointer}
#crafting{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:#0009;pointer-events:auto}
#crafting.open{display:flex}
.craftingWindow{width:min(760px,94vw);max-height:90vh;overflow:auto;padding:25px;background:#c6c6c6;border:4px solid #555;box-shadow:0 15px 50px #0009}
.craftingTitle{font-size:26px;font-weight:bold;color:#222;margin-bottom:20px}
.craftingLayout{display:flex;align-items:center;justify-content:center;gap:28px}
.craftingGrid{display:grid;gap:5px}
.craftingGrid.two{grid-template-columns:repeat(2,65px);grid-template-rows:repeat(2,65px)}
.craftingGrid.three{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
.craftSlot{width:65px;height:65px;background:#8b8b8b;border:4px solid #555;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.three .craftSlot{width:58px;height:58px}
.craftSlot:hover,.craftResult:hover{background:#999}
.craftItem{width:42px;height:42px;border:2px solid #0004}
.craftAmount,.resultAmount{position:absolute;right:4px;bottom:2px;color:#fff;font-weight:bold;text-shadow:2px 2px #000}
.craftArrow{font-size:42px;color:#333}
.craftResult{width:90px;height:90px;background:#8b8b8b;border:4px solid #555;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.resultItem{width:52px;height:52px;border:2px solid #0004}
.craftingHint{margin-top:20px;color:#333;font-size:14px;line-height:1.5}
.closeCrafting{margin-top:20px;padding:10px 25px;border:0;background:#555;color:#fff;font-weight:bold;cursor:pointer}
#craftInventory{margin-top:18px;color:#333;font-size:14px}
@media(max-width:700px){.startBox h1{font-size:42px}.slot{width:50px;height:50px}.preview{width:28px;height:28px}#help{font-size:11px}.craftingLayout{gap:8px}.craftingGrid.two{grid-template-columns:repeat(2,52px);grid-template-rows:repeat(2,52px)}.craftSlot{width:52px;height:52px}.craftingGrid.three{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}.three .craftSlot{width:46px;height:46px}.craftResult{width:70px;height:70px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen"><div class="startBox">
<h1>BlockWorld</h1>
<p>Explore a world made of blocks.<br>Break, collect, craft and build!</p>
<button id="startButton">START GAME</button>
</div></div>

<div id="ui">
<div id="crosshair"></div>
<div id="help"><b>Controls</b><br>WASD — Move<br>SPACE — Jump<br>Mouse — Look<br>Hold Left Click — Break<br>Right Click — Place / open table<br>1–8 — Select item<br>E — 2×2 crafting<br>ESC — Release mouse</div>
<div id="blockInfo">Selected: <b id="selectedName">Grass</b></div>
<div id="message"></div>
<div id="breakingText">Breaking...</div>
<button id="reset">Reset World</button>
<div id="hotbar"></div>
</div>

<div id="crafting">
<div class="craftingWindow">
<div class="craftingTitle" id="craftingTitle">Crafting</div>
<div class="craftingLayout">
<div id="craftGrid" class="craftingGrid two"></div>
<div class="craftArrow">→</div>
<div class="craftResult" id="craftResult"><div class="resultItem" id="resultPreview"></div><span class="resultAmount" id="resultAmount">0</span></div>
</div>
<div id="craftInventory"></div>
<div class="craftingHint" id="craftHint"></div>
<button class="closeCrafting" id="closeCrafting">Close</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,20,80);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1.8));
const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(30,50,20);scene.add(sun);

const BLOCKS={
grass:{id:"grass",name:"Grass",color:0x62b84b,breakable:true,placeable:true},
dirt:{id:"dirt",name:"Dirt",color:0x8b5a2b,breakable:true,placeable:true},
stone:{id:"stone",name:"Stone",color:0x888888,breakable:"pickaxe",placeable:true},
wood:{id:"wood",name:"Wood",color:0x9b6b30,breakable:true,placeable:true},
leaves:{id:"leaves",name:"Leaves",color:0x4c9f4c,breakable:true,placeable:true},
planks:{id:"planks",name:"Planks",color:0xb47b3c,breakable:true,placeable:true},
crafting_table:{id:"crafting_table",name:"Crafting Table",color:0x9a632f,breakable:true,placeable:true}
};
const ITEMS={
stick:{id:"stick",name:"Stick",color:0xc08a4a,placeable:false},
wood_pickaxe:{id:"wood_pickaxe",name:"Wooden Pickaxe",color:0x8b5a2b,placeable:false}
};
const inventory={grass:0,dirt:0,stone:0,wood:0,leaves:0,planks:0,crafting_table:0,stick:0,wood_pickaxe:0};
const hotbar=[
BLOCKS.grass,BLOCKS.dirt,BLOCKS.stone,BLOCKS.wood,BLOCKS.leaves,BLOCKS.planks,BLOCKS.crafting_table,ITEMS.wood_pickaxe
];
let selectedBlock=0;

const world=new Map(),meshes=new Map();
const SIZE=24;
const key=(x,y,z)=>`${x},${y},${z}`;

function terrainHeight(x,z){
 return Math.max(1,Math.min(6,Math.floor(3+Math.sin(x*.4)+Math.cos(z*.35)+Math.sin((x+z)*.2))));
}
function addBlock(x,y,z,type){
 const k=key(x,y,z); if(world.has(k))return;
 const cube=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:type.color}));
 cube.position.set(x+.5,y+.5,z+.5);
 cube.userData={key:k,type};
 scene.add(cube);world.set(k,type);meshes.set(k,cube);
}
function removeBlock(x,y,z){
 const k=key(x,y,z),cube=meshes.get(k);if(!cube)return null;
 const type=cube.userData.type;scene.remove(cube);cube.geometry.dispose();cube.material.dispose();meshes.delete(k);world.delete(k);return type;
}
function generateWorld(){
 meshes.forEach(c=>{scene.remove(c);c.geometry.dispose();c.material.dispose()});
 world.clear();meshes.clear();
 for(let x=0;x<SIZE;x++)for(let z=0;z<SIZE;z++){
  const h=terrainHeight(x,z);
  for(let y=0;y<=h;y++)addBlock(x,y,z,y===h?BLOCKS.grass:y>=h-2?BLOCKS.dirt:BLOCKS.stone);
 }
 [[4,5],[10,8],[17,5],[18,15],[7,18]].forEach(([x,z])=>{
  const g=terrainHeight(x,z);
  for(let y=g+1;y<=g+4;y++)addBlock(x,y,z,BLOCKS.wood);
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)
   if(Math.abs(dx)+Math.abs(dz)<=3)addBlock(x+dx,g+3,z+dz,BLOCKS.leaves);
 });
 camera.position.set(12.5,terrainHeight(12,12)+1.7,12.5);
}

const PLAYER_HEIGHT=2, EYE_HEIGHT=1.7, PLAYER_RADIUS=.3;
function collides(x,bottom,z){
 const minX=Math.floor(x-PLAYER_RADIUS),maxX=Math.floor(x+PLAYER_RADIUS);
 const minY=Math.floor(bottom+0.001),maxY=Math.floor(bottom+PLAYER_HEIGHT-0.001);
 const minZ=Math.floor(z-PLAYER_RADIUS+0.001),maxZ=Math.floor(z+PLAYER_RADIUS-0.001);
 for(let bx=minX;bx<=maxX;bx++)for(let by=minY;by<=maxY;by++)for(let bz=minZ;bz<=maxZ;bz++)
  if(world.has(key(bx,by,bz)))return true;
 return false;
}
const keys={};let velocityY=0,grounded=false;
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space"&&grounded){velocityY=8;grounded=false}
 if(e.code==="KeyE"&&!craftingOpen)openPlayerCrafting();
 if(e.code.startsWith("Digit")){
  const n=Number(e.code.slice(5));if(n>=1&&n<=hotbar.length)selectHotbar(n-1);
 }
});
document.addEventListener("keyup",e=>keys[e.code]=false);

let yaw=0,pitch=0,mouseLocked=false,craftingOpen=false;
document.addEventListener("mousemove",e=>{
 if(!mouseLocked||craftingOpen)return;
 yaw-=e.movementX*.002;pitch-=e.movementY*.002;
 pitch=Math.max(-Math.PI/2+.05,Math.min(Math.PI/2-.05,pitch));
 camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;
});
document.addEventListener("pointerlockchange",()=>{
 mouseLocked=document.pointerLockElement===document.body;
 if(mouseLocked) showMessage("WASD to move • Mouse to look");
});
function lockMouse(){if(!craftingOpen&&!document.pointerLockElement)document.body.requestPointerLock()}

function updatePlayer(dt){
 if(!mouseLocked||craftingOpen)return;
 const speed=5*dt,forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();
 const right=new THREE.Vector3(forward.z,0,-forward.x),move=new THREE.Vector3();
 if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyA)move.sub(right);if(keys.KeyD)move.add(right);
 if(move.length()){move.normalize();const bottom=camera.position.y-EYE_HEIGHT;
  const nx=camera.position.x+move.x*speed,nz=camera.position.z+move.z*speed;
  if(!collides(nx,bottom,camera.position.z))camera.position.x=nx;
  if(!collides(camera.position.x,bottom,nz))camera.position.z=nz;
 }
 velocityY-=20*dt;
 const ny=camera.position.y+velocityY*dt,nb=ny-EYE_HEIGHT;
 if(!collides(camera.position.x,nb,camera.position.z)){camera.position.y=ny;grounded=false}
 else{if(velocityY<0)grounded=true;velocityY=0}
 if(camera.position.y<-10){camera.position.set(12.5,10,12.5);velocityY=0}
}

const raycaster=new THREE.Raycaster(),center=new THREE.Vector2(0,0);
function getTarget(){
 raycaster.setFromCamera(center,camera);
 const hits=raycaster.intersectObjects(Array.from(meshes.values()));
 return hits.length&&hits[0].distance<=6?hits[0]:null;
}

let breaking=false,breakingKey=null,breakingStart=0,leftMouseDown=false;
const BREAK_TIME=500;
const crackCanvas=document.createElement("canvas");crackCanvas.width=256;crackCanvas.height=256;
const crackCtx=crackCanvas.getContext("2d"),crackTexture=new THREE.CanvasTexture(crackCanvas);
const crackMesh=new THREE.Mesh(new THREE.BoxGeometry(1.004,1.004,1.004),new THREE.MeshBasicMaterial({map:crackTexture,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}));
crackMesh.visible=false;scene.add(crackMesh);
function drawCracks(stage){
 const ctx=crackCtx;ctx.clearRect(0,0,256,256);ctx.strokeStyle="rgba(15,15,15,.95)";ctx.lineWidth=7;ctx.lineCap="round";
 const lines=[[[25,20],[80,70],[55,120]],[[180,15],[140,80],[190,130]],[[120,30],[105,100],[135,155]],[[20,180],[80,150],[100,220]],[[235,175],[175,145],[155,220]],[[75,70],[145,70],[180,115]],[[55,120],[110,115],[170,145]]];
 for(let i=0;i<Math.ceil(lines.length*stage);i++){ctx.beginPath();ctx.moveTo(...lines[i][0]);for(let j=1;j<lines[i].length;j++)ctx.lineTo(...lines[i][j]);ctx.stroke()}
 crackTexture.needsUpdate=true;
}
function stopBreaking(){breaking=false;breakingKey=null;crackMesh.visible=false;document.getElementById("breakingText").classList.remove("show")}
function canBreak(type){
 if(type.breakable===true)return true;
 if(type.breakable==="pickaxe")return inventory.wood_pickaxe>0 && hotbar[selectedBlock]?.id==="wood_pickaxe";
 return false;
}
function updateBreaking(){
 if(!mouseLocked||craftingOpen||!leftMouseDown){stopBreaking();return}
 const hit=getTarget();if(!hit){stopBreaking();return}
 const type=hit.object.userData.type;
 if(!canBreak(type)){
  stopBreaking();
  showMessage(type===BLOCKS.stone?"You need a wooden pickaxe to break stone!":"You cannot break this!");
  return;
 }
 const k=hit.object.userData.key;
 if(!breaking||breakingKey!==k){breaking=true;breakingKey=k;breakingStart=performance.now()}
 const progress=Math.min(1,(performance.now()-breakingStart)/BREAK_TIME);
 drawCracks(Math.max(.1,progress));crackMesh.position.copy(hit.object.position);crackMesh.visible=true;
 document.getElementById("breakingText").classList.add("show");
 if(progress>=1)breakBlock(hit.object);
}
function breakBlock(cube){
 const p=cube.userData.key.split(",").map(Number),type=removeBlock(...p);
 if(type){inventory[type.id]++;updateHotbar();showMessage("Collected "+type.name+"!")}
 stopBreaking();
}

function placeBlock(){
 const hit=getTarget();if(!hit)return;
 const item=hotbar[selectedBlock];
 if(!item.placeable){showMessage("That item cannot be placed.");return}
 if(inventory[item.id]<=0){showMessage("You don't have any "+item.name+"!");return}
 if(item===BLOCKS.crafting_table && hit.object.userData.type===BLOCKS.crafting_table){openTableCrafting();return}
 const n=hit.face.normal,p=hit.object.position;
 const x=Math.floor(p.x+n.x),y=Math.floor(p.y+n.y),z=Math.floor(p.z+n.z);
 const bottom=camera.position.y-EYE_HEIGHT;
 if(camera.position.x+PLAYER_RADIUS>x&&camera.position.x-PLAYER_RADIUS<x+1&&camera.position.z+PLAYER_RADIUS>z&&camera.position.z-PLAYER_RADIUS<z+1&&bottom+PLAYER_HEIGHT>y&&bottom<y+1){showMessage("You cannot place a block here!");return}
 if(world.has(key(x,y,z)))return;
 addBlock(x,y,z,item);inventory[item.id]--;updateHotbar();showMessage("Placed "+item.name);
}

document.addEventListener("mousedown",e=>{
 if(craftingOpen)return;
 if(e.button===0&&mouseLocked)leftMouseDown=true;
 if(e.button===2&&mouseLocked){
  const hit=getTarget();
  if(hit&&hit.object.userData.type===BLOCKS.crafting_table){openTableCrafting();return}
  placeBlock();
 }
});
document.addEventListener("mouseup",e=>{if(e.button===0){leftMouseDown=false;stopBreaking()}});
document.addEventListener("contextmenu",e=>e.preventDefault());

function selectHotbar(i){
 selectedBlock=i;
 document.querySelectorAll(".slot").forEach(s=>s.classList.toggle("selected",Number(s.dataset.index)===i));
 document.getElementById("selectedName").textContent=hotbar[i].name;
}
function updateHotbar(){
 const bar=document.getElementById("hotbar");bar.innerHTML="";
 hotbar.forEach((item,i)=>{
  const slot=document.createElement("div");slot.className="slot"+(i===selectedBlock?" selected":"");slot.dataset.index=i;
  const preview=document.createElement("div");preview.className="preview";preview.style.background="#"+item.color.toString(16).padStart(6,"0");
  slot.append(preview);
  const n=document.createElement("span");n.className="number";n.textContent=i+1;slot.append(n);
  const a=document.createElement("span");a.className="amount";a.textContent=inventory[item.id]||0;slot.append(a);
  slot.onclick=e=>{e.stopPropagation();selectHotbar(i)};bar.append(slot);
 });
}
let messageTimer;
function showMessage(text){const el=document.getElementById("message");el.textContent=text;el.classList.add("show");clearTimeout(messageTimer);messageTimer=setTimeout(()=>el.classList.remove("show"),1600)}

let gridSize=2,craftGrid=[],craftMode="player",craftSelectedItem=null;
function openPlayerCrafting(){openCrafting(2,"player")}
function openTableCrafting(){openCrafting(3,"table")}
function openCrafting(size,mode){
 stopBreaking();craftingOpen=true;gridSize=size;craftMode=mode;craftGrid=Array(size*size).fill(null);
 document.getElementById("crafting").classList.add("open");
 document.getElementById("craftingTitle").textContent=mode==="table"?"Crafting Table":"Crafting";
 document.getElementById("craftHint").innerHTML=mode==="table"
  ?"3×3 crafting: 3 planks across the top + 2 sticks down the middle = 1 wooden pickaxe."
  :"2×2 crafting: 4 planks = 1 crafting table. Two planks next to each other = 4 sticks.";
 document.exitPointerLock();renderCrafting();
}
function closeCrafting(){
 returnGridToInventory();craftingOpen=false;document.getElementById("crafting").classList.remove("open");updateHotbar();lockMouse();
}
document.getElementById("closeCrafting").onclick=closeCrafting;

function returnGridToInventory(){craftGrid.forEach(id=>{if(id)inventory[id]++});craftGrid=[]}
function itemColor(id){return (BLOCKS[id]||ITEMS[id]).color}
function renderCrafting(){
 const grid=document.getElementById("craftGrid");grid.className="craftingGrid "+(gridSize===2?"two":"three");grid.innerHTML="";
 craftGrid.forEach((id,i)=>{
  const s=document.createElement("div");s.className="craftSlot";s.dataset.index=i;
  if(id){const d=document.createElement("div");d.className="craftItem";d.style.background="#"+itemColor(id).toString(16).padStart(6,"0");s.append(d);const a=document.createElement("span");a.className="craftAmount";a.textContent="1";s.append(a)}
  s.onclick=()=>craftSlotClick(i);grid.append(s);
 });
 const recipe=getRecipe();
 const rp=document.getElementById("resultPreview"),ra=document.getElementById("resultAmount");
 if(recipe){rp.style.background="#"+itemColor(recipe.output).toString(16).padStart(6,"0");ra.textContent=recipe.count}else{rp.style.background="#555";ra.textContent="0"}
 document.getElementById("craftInventory").textContent="Selected item for crafting: "+(craftSelectedItem?(BLOCKS[craftSelectedItem]||ITEMS[craftSelectedItem]).name:"none")+". Select an item in the hotbar, then click a grid slot.";
}
function craftSlotClick(i){
 if(craftGrid[i]){
  inventory[craftGrid[i]]++;craftGrid[i]=null;updateHotbar();renderCrafting();return;
 }
 const id=craftSelectedItem;
 if(!id||!inventory[id]){showMessage("Select an item with the hotbar first.");return}
 inventory[id]--;craftGrid[i]=id;updateHotbar();renderCrafting();
}
document.getElementById("craftResult").onclick=()=>{
 const recipe=getRecipe();
 if(!recipe){showMessage("That recipe does not match.");return}
 recipe.ingredients.forEach(id=>{const i=craftGrid.indexOf(id);if(i>=0)craftGrid[i]=null});
 inventory[recipe.output]+=recipe.count;updateHotbar();renderCrafting();showMessage("Crafted "+recipe.count+" "+(BLOCKS[recipe.output]||ITEMS[recipe.output]).name+(recipe.count>1?"s":"")+"!");
};
function getRecipe(){
 const n=gridSize;
 const g=craftGrid;
 const count=id=>g.filter(x=>x===id).length;
 if(n===2){
  if(count("planks")===4)return {output:"crafting_table",count:1,ingredients:["planks","planks","planks","planks"]};
  if(count("planks")===2 && g.every(x=>x===null||x==="planks")){
   const positions=[];g.forEach((x,i)=>{if(x==="planks")positions.push(i)});
   const adjacent=(positions.includes(0)&&positions.includes(1))||(positions.includes(2)&&positions.includes(3))||(positions.includes(0)&&positions.includes(2))||(positions.includes(1)&&positions.includes(3));
   if(adjacent)return {output:"stick",count:4,ingredients:["planks","planks"]};
  }
 }
 if(n===3){
  const pickaxe=["planks","planks","planks",null,"stick",null,null,"stick",null];
  if(g.every((x,i)=>x===pickaxe[i]))return {output:"wood_pickaxe",count:1,ingredients:["planks","planks","planks","stick","stick"]};
  if(count("planks")===2){
   const p=[];g.forEach((x,i)=>{if(x==="planks")p.push(i)});
   const adjacent=(p[0]+1===p[1]&&Math.floor(p[0]/3)===Math.floor(p[1]/3))||(p[0]+3===p[1]);
   if(adjacent)return {output:"stick",count:4,ingredients:["planks","planks"]};
  }
 }
 return null;
};

document.querySelectorAll(".slot").forEach(()=>{});
document.getElementById("startButton").onclick=()=>{
 document.getElementById("startScreen").style.display="none";
 // Request pointer lock directly from the button click.
 document.body.requestPointerLock();
};
document.getElementById("reset").onclick=e=>{
 e.stopPropagation();Object.keys(inventory).forEach(k=>inventory[k]=0);craftSelectedItem=null;generateWorld();updateHotbar();showMessage("World reset!");
};
document.addEventListener("click",e=>{
 if(craftingOpen&&e.target.closest(".slot")){const i=Number(e.target.closest(".slot").dataset.index);craftSelectedItem=hotbar[i].id;renderCrafting();showMessage("Selected "+hotbar[i].name)}
});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

generateWorld();updateHotbar();selectHotbar(0);
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);updatePlayer(dt);updateBreaking();renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
