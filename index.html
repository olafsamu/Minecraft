<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWorld</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ================= START SCREEN ================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            rgba(20, 80, 130, 0.75),
            rgba(20, 40, 70, 0.9)
        );
}

.startBox {
    width: min(90%, 600px);
    padding: 45px 30px;

    text-align: center;

    background: white;
    border-radius: 20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.4);
}

.startBox h1 {
    font-size: 60px;
    color: #4caf50;

    text-shadow:
        3px 3px #2e7d32;

    margin-bottom: 15px;
}

.startBox p {
    color: #555;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

#startButton {
    border: none;

    padding: 16px 55px;

    font-size: 24px;
    font-weight: bold;

    color: white;
    background: #4caf50;

    border-radius: 10px;

    cursor: pointer;

    box-shadow:
        0 6px #2e7d32;
}

#startButton:hover {
    background: #5bcf60;
}

#startButton:active {
    transform: translateY(5px);
    box-shadow: 0 1px #2e7d32;
}

/* ================= UI ================= */

#ui {
    position: fixed;
    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 20px;
    height: 20px;
}

#crosshair::before {
    content: "";

    position: absolute;

    left: 9px;
    top: 0;

    width: 2px;
    height: 20px;

    background: white;

    box-shadow: 0 0 3px black;
}

#crosshair::after {
    content: "";

    position: absolute;

    left: 0;
    top: 9px;

    width: 20px;
    height: 2px;

    background: white;

    box-shadow: 0 0 3px black;
}

#help {
    position: absolute;

    top: 15px;
    left: 15px;

    padding: 12px 16px;

    color: white;

    background: rgba(0,0,0,0.5);

    border-radius: 8px;

    font-size: 14px;

    line-height: 1.5;
}

#blockInfo {
    position: absolute;

    top: 15px;
    right: 15px;

    padding: 12px 16px;

    color: white;

    background: rgba(0,0,0,0.5);

    border-radius: 8px;
}

#message {
    position: absolute;

    top: 80px;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(-15px);

    padding: 10px 20px;

    color: white;

    background: rgba(0,0,0,0.65);

    border-radius: 20px;

    opacity: 0;

    transition: 0.25s;
}

#message.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ================= HOTBAR ================= */

#hotbar {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 5px;

    padding: 7px;

    background: rgba(0,0,0,0.5);

    border-radius: 10px;
}

.slot {
    width: 65px;
    height: 65px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    border: 3px solid #777;

    background: rgba(30,30,30,0.8);

    border-radius: 5px;
}

.slot.selected {
    border-color: white;

    box-shadow:
        0 0 0 2px #ffd54f;
}

.preview {
    width: 38px;
    height: 38px;

    border: 2px solid rgba(0,0,0,0.3);
}

.number {
    position: absolute;

    bottom: 2px;
    left: 5px;

    color: white;

    font-size: 12px;

    text-shadow:
        1px 1px 2px black;
}

.amount {
    position: absolute;

    right: 5px;
    bottom: 3px;

    color: white;

    font-size: 16px;
    font-weight: bold;

    text-shadow:
        2px 2px 2px black;
}

/* ================= RESET ================= */

#reset {
    position: absolute;

    right: 20px;
    bottom: 105px;

    pointer-events: auto;

    padding: 9px 14px;

    border: none;

    border-radius: 7px;

    color: white;

    background: rgba(0,0,0,0.55);

    cursor: pointer;
}

#reset:hover {
    background: rgba(0,0,0,0.8);
}

/* ================= BREAKING INDICATOR ================= */

#breakingText {
    position: absolute;

    left: 50%;
    top: calc(50% + 25px);

    transform: translateX(-50%);

    color: white;

    font-size: 13px;

    text-shadow:
        2px 2px 3px black;

    opacity: 0;
}

#breakingText.show {
    opacity: 1;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .startBox h1 {
        font-size: 42px;
    }

    .slot {
        width: 50px;
        height: 50px;
    }

    .preview {
        width: 28px;
        height: 28px;
    }

    #help {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ================= START SCREEN ================= -->

<div id="startScreen">

    <div class="startBox">

        <h1>BlockWorld</h1>

        <p>
            Explore a world made of blocks.
            <br>
            Break, collect and build!
        </p>

        <button id="startButton">
            START GAME
        </button>

    </div>

</div>

<!-- ================= GAME UI ================= -->

<div id="ui">

    <div id="crosshair"></div>

    <div id="help">
        <b>Controls</b><br>
        WASD — Move<br>
        SPACE — Jump<br>
        Mouse — Look<br>
        Hold Left Click — Break<br>
        Right Click — Place<br>
        1–5 — Select block<br>
        ESC — Release mouse
    </div>

    <div id="blockInfo">
        Selected:
        <b id="selectedName">Grass</b>
    </div>

    <div id="message">
        Block broken!
    </div>

    <div id="breakingText">
        Breaking...
    </div>

    <button id="reset">
        Reset World
    </button>

    <div id="hotbar">

        <div class="slot selected" data-index="0">
            <div class="preview"
                 style="background:#62b84b"></div>
            <span class="number">1</span>
            <span class="amount">0</span>
        </div>

        <div class="slot" data-index="1">
            <div class="preview"
                 style="background:#8b5a2b"></div>
            <span class="number">2</span>
            <span class="amount">0</span>
        </div>

        <div class="slot" data-index="2">
            <div class="preview"
                 style="background:#888"></div>
            <span class="number">3</span>
            <span class="amount">0</span>
        </div>

        <div class="slot" data-index="3">
            <div class="preview"
                 style="background:#9b6b30"></div>
            <span class="number">4</span>
            <span class="amount">0</span>
        </div>

        <div class="slot" data-index="4">
            <div class="preview"
                 style="background:#4c9f4c"></div>
            <span class="number">5</span>
            <span class="amount">0</span>
        </div>

    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   SCENE
===================================================== */

const canvas =
    document.getElementById("game");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        20,
        80
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        200
    );


/*
   PLAYER HEIGHT = 2 BLOCKS
*/

const PLAYER_HEIGHT = 2;


/*
   The camera sits around eye height.
*/

const EYE_HEIGHT = 1.7;


camera.position.set(
    12,
    8,
    12
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: false
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.8
    )
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

sun.position.set(
    30,
    50,
    20
);

scene.add(sun);


/* =====================================================
   BLOCK TYPES
===================================================== */

const blocks = [

    {
        id: "grass",
        name: "Grass",
        color: 0x62b84b,
        breakable: true
    },

    {
        id: "dirt",
        name: "Dirt",
        color: 0x8b5a2b,
        breakable: true
    },

    {
        id: "stone",
        name: "Stone",
        color: 0x888888,
        breakable: false
    },

    {
        id: "wood",
        name: "Wood",
        color: 0x9b6b30,
        breakable: true
    },

    {
        id: "leaves",
        name: "Leaves",
        color: 0x4c9f4c,
        breakable: true
    }

];


/* =====================================================
   INVENTORY
===================================================== */

const inventory = {

    grass: 0,
    dirt: 0,
    stone: 0,
    wood: 0,
    leaves: 0

};


/* =====================================================
   WORLD
===================================================== */

const world =
    new Map();

const meshes =
    new Map();

const SIZE = 24;


/* =====================================================
   BLOCK KEY
===================================================== */

function blockKey(
    x,
    y,
    z
) {

    return (
        x + "," +
        y + "," +
        z
    );

}


/* =====================================================
   TERRAIN
===================================================== */

function terrainHeight(
    x,
    z
) {

    return Math.max(
        1,

        Math.min(
            6,

            Math.floor(
                3
                + Math.sin(x * 0.4)
                + Math.cos(z * 0.35)
                + Math.sin(
                    (x + z) * 0.2
                )
            )
        )
    );

}


/* =====================================================
   ADD BLOCK
===================================================== */

function addBlock(
    x,
    y,
    z,
    type
) {

    const key =
        blockKey(
            x,
            y,
            z
        );


    if (
        world.has(key)
    ) {
        return;
    }


    const geometry =
        new THREE.BoxGeometry(
            1,
            1,
            1
        );


    const material =
        new THREE.MeshLambertMaterial({
            color: type.color
        });


    const cube =
        new THREE.Mesh(
            geometry,
            material
        );


    cube.position.set(
        x + 0.5,
        y + 0.5,
        z + 0.5
    );


    cube.userData.key =
        key;

    cube.userData.type =
        type;


    scene.add(cube);

    world.set(
        key,
        type
    );

    meshes.set(
        key,
        cube
    );

}


/* =====================================================
   REMOVE BLOCK
===================================================== */

function removeBlock(
    x,
    y,
    z
) {

    const key =
        blockKey(
            x,
            y,
            z
        );


    const cube =
        meshes.get(key);


    if (!cube) {
        return null;
    }


    const type =
        cube.userData.type;


    scene.remove(cube);

    cube.geometry.dispose();

    cube.material.dispose();


    meshes.delete(key);

    world.delete(key);


    return type;

}


/* =====================================================
   GENERATE WORLD
===================================================== */

function generateWorld() {

    meshes.forEach(
        cube => {

            scene.remove(cube);

            cube.geometry.dispose();

            cube.material.dispose();

        }
    );


    world.clear();

    meshes.clear();


    for (
        let x = 0;
        x < SIZE;
        x++
    ) {

        for (
            let z = 0;
            z < SIZE;
            z++
        ) {

            const height =
                terrainHeight(
                    x,
                    z
                );


            for (
                let y = 0;
                y <= height;
                y++
            ) {

                let type;


                if (
                    y === height
                ) {

                    type =
                        blocks[0];

                }

                else if (
                    y >= height - 2
                ) {

                    type =
                        blocks[1];

                }

                else {

                    type =
                        blocks[2];

                }


                addBlock(
                    x,
                    y,
                    z,
                    type
                );

            }

        }

    }


    /*
       Trees.
    */

    const trees = [

        [4, 5],
        [10, 8],
        [17, 5],
        [18, 15],
        [7, 18]

    ];


    trees.forEach(
        ([x, z]) => {

            const ground =
                terrainHeight(
                    x,
                    z
                );


            for (
                let y = ground + 1;
                y <= ground + 4;
                y++
            ) {

                addBlock(
                    x,
                    y,
                    z,
                    blocks[3]
                );

            }


            for (
                let dx = -2;
                dx <= 2;
                dx++
            ) {

                for (
                    let dz = -2;
                    dz <= 2;
                    dz++
                ) {

                    if (
                        Math.abs(dx) +
                        Math.abs(dz)
                        <= 3
                    ) {

                        addBlock(
                            x + dx,
                            ground + 3,
                            z + dz,
                            blocks[4]
                        );

                    }

                }

            }

        }
    );


    /*
       Spawn player.
    */

    const spawnX = 12;
    const spawnZ = 12;

    const ground =
        terrainHeight(
            spawnX,
            spawnZ
        );


    camera.position.set(
        spawnX + 0.5,
        ground + EYE_HEIGHT,
        spawnZ + 0.5
    );

}


/* =====================================================
   MOUSE LOOK
===================================================== */

let yaw = 0;
let pitch = 0;

let mouseLocked = false;


document.addEventListener(
    "mousemove",
    event => {

        if (!mouseLocked) {
            return;
        }


        yaw -=
            event.movementX * 0.002;

        pitch -=
            event.movementY * 0.002;


        pitch =
            Math.max(
                -Math.PI / 2 + 0.05,
                Math.min(
                    Math.PI / 2 - 0.05,
                    pitch
                )
            );


        camera.rotation.order =
            "YXZ";

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);


/* =====================================================
   POINTER LOCK
===================================================== */

function lockMouse() {

    document.body.requestPointerLock();

}


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement
            === document.body;

    }
);


/* =====================================================
   START BUTTON
===================================================== */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "startScreen"
                )
                .style.display =
                "none";


            lockMouse();

        }
    );


/* =====================================================
   MOVEMENT
===================================================== */

const keys = {};

let velocityY = 0;

let grounded = false;


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        /*
           Jump.
        */

        if (
            event.code === "Space" &&
            grounded
        ) {

            velocityY = 8;

            grounded = false;

        }


        /*
           Hotbar.
        */

        if (
            event.code.startsWith(
                "Digit"
            )
        ) {

            const number =
                Number(
                    event.code.replace(
                        "Digit",
                        ""
                    )
                );


            if (
                number >= 1 &&
                number <= 5
            ) {

                selectBlock(
                    number - 1
                );

            }

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;

    }
);


/* =====================================================
   PLAYER COLLISION
===================================================== */

const PLAYER_RADIUS =
    0.3;


/*
   Check if the two-block-tall
   player would collide.
*/

function collides(
    x,
    y,
    z
) {

    const minX =
        Math.floor(
            x - PLAYER_RADIUS
        );

    const maxX =
        Math.floor(
            x + PLAYER_RADIUS
        );


    const minY =
        Math.floor(y);


    const maxY =
        Math.floor(
            y + PLAYER_HEIGHT
        );


    const minZ =
        Math.floor(
            z - PLAYER_RADIUS
        );

    const maxZ =
        Math.floor(
            z + PLAYER_RADIUS
        );


    for (
        let bx = minX;
        bx <= maxX;
        bx++
    ) {

        for (
            let by = minY;
            by <= maxY;
            by++
        ) {

            for (
                let bz = minZ;
                bz <= maxZ;
                bz++
            ) {

                if (
                    world.has(
                        blockKey(
                            bx,
                            by,
                            bz
                        )
                    )
                ) {

                    return true;

                }

            }

        }

    }


    return false;

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(
    delta
) {

    if (!mouseLocked) {
        return;
    }


    const speed =
        5 * delta;


    const forward =
        new THREE.Vector3();


    camera.getWorldDirection(
        forward
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3(
            forward.z,
            0,
            -forward.x
        );


    const movement =
        new THREE.Vector3();


    if (keys["KeyW"])
        movement.add(forward);

    if (keys["KeyS"])
        movement.sub(forward);

    if (keys["KeyA"])
        movement.sub(right);

    if (keys["KeyD"])
        movement.add(right);


    if (
        movement.length() > 0
    ) {

        movement.normalize();


        const nextX =
            camera.position.x +
            movement.x * speed;


        const nextZ =
            camera.position.z +
            movement.z * speed;


        /*
           Convert camera eye position
           into player bottom position.
        */

        const bottom =
            camera.position.y -
            EYE_HEIGHT;


        if (
            !collides(
                nextX,
                bottom,
                camera.position.z
            )
        ) {

            camera.position.x =
                nextX;

        }


        if (
            !collides(
                camera.position.x,
                bottom,
                nextZ
            )
        ) {

            camera.position.z =
                nextZ;

        }

    }


    /*
       Gravity.
    */

    velocityY -=
        20 * delta;


    const newY =
        camera.position.y +
        velocityY * delta;


    const newBottom =
        newY -
        EYE_HEIGHT;


    if (
        !collides(
            camera.position.x,
            newBottom,
            camera.position.z
        )
    ) {

        camera.position.y =
            newY;

        grounded = false;

    }

    else {

        if (
            velocityY < 0
        ) {

            grounded = true;

        }


        velocityY = 0;

    }


    /*
       Respawn.
    */

    if (
        camera.position.y < -10
    ) {

        camera.position.set(
            12.5,
            10,
            12.5
        );

        velocityY = 0;

    }

}


/* =====================================================
   RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();


const center =
    new THREE.Vector2(
        0,
        0
    );


function getTarget() {

    raycaster.setFromCamera(
        center,
        camera
    );


    const objects =
        Array.from(
            meshes.values()
        );


    const hits =
        raycaster.intersectObjects(
            objects
        );


    if (
        hits.length === 0
    ) {

        return null;

    }


    if (
        hits[0].distance > 6
    ) {

        return null;

    }


    return hits[0];

}


/* =====================================================
   BREAKING STATE
===================================================== */

let breaking = false;

let breakingKey = null;

let breakingStart = 0;

const BREAK_TIME =
    500;


/* =====================================================
   CRACK MATERIAL
===================================================== */

/*
   This creates the Minecraft-style
   progressive crack effect.

   The cracks are drawn procedurally
   so no external texture file is needed.
*/

const crackCanvas =
    document.createElement("canvas");

crackCanvas.width = 256;
crackCanvas.height = 256;


const crackContext =
    crackCanvas.getContext("2d");


const crackTexture =
    new THREE.CanvasTexture(
        crackCanvas
    );


const crackMaterial =
    new THREE.MeshBasicMaterial({

        map: crackTexture,

        transparent: true,

        opacity: 0,

        depthWrite: false,

        polygonOffset: true,

        polygonOffsetFactor: -4,

        polygonOffsetUnits: -4

    });


const crackMesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.004,
            1.004,
            1.004
        ),
        crackMaterial
    );


crackMesh.visible = false;

scene.add(
    crackMesh
);


/* =====================================================
   DRAW CRACKS
===================================================== */

function drawCracks(
    stage
) {

    const ctx =
        crackContext;


    ctx.clearRect(
        0,
        0,
        256,
        256
    );


    /*
       Transparent background.
    */

    ctx.strokeStyle =
        "rgba(20,20,20,0.95)";


    ctx.lineWidth =
        7;

    ctx.lineCap =
        "round";


    /*
       Different crack stages.
    */

    const cracks = [

        [
            [25,20],
            [80,70],
            [55,120]
        ],

        [
            [180,15],
            [140,80],
            [190,130]
        ],

        [
            [120,30],
            [105,100],
            [135,155]
        ],

        [
            [20,180],
            [80,150],
            [100,220]
        ],

        [
            [235,175],
            [175,145],
            [155,220]
        ],

        [
            [75,70],
            [145,70],
            [180,115]
        ],

        [
            [55,120],
            [110,115],
            [170,145]
        ]

    ];


    const count =
        Math.ceil(
            cracks.length *
            stage
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const crack =
            cracks[i];


        ctx.beginPath();

        ctx.moveTo(
            crack[0][0],
            crack[0][1]
        );


        for (
            let j = 1;
            j < crack.length;
            j++
        ) {

            ctx.lineTo(
                crack[j][0],
                crack[j][1]
            );

        }


        ctx.stroke();

    }


    crackTexture.needsUpdate =
        true;

}


/* =====================================================
   UPDATE CRACK
===================================================== */

function updateCrack(
    hit
) {

    if (!hit) {

        crackMesh.visible =
            false;

        return;

    }


    const key =
        hit.object.userData.key;


    const now =
        performance.now();


    if (
        !breaking ||
        breakingKey !== key
    ) {

        breaking =
            true;

        breakingKey =
            key;

        breakingStart =
            now;

    }


    const progress =
        Math.min(
            1,
            (now - breakingStart) /
            BREAK_TIME
        );


    /*
       10 Minecraft-like stages.
    */

    const stage =
        Math.ceil(
            progress * 10
        ) / 10;


    drawCracks(
        Math.max(
            0.1,
            stage
        )
    );


    crackMesh.visible =
        true;


    crackMesh.position.copy(
        hit.object.position
    );


    /*
       Slightly larger so the crack
       appears over the block.
    */

    crackMesh.scale.set(
        1,
        1,
        1
    );


    if (
        progress >= 1
    ) {

        finishBreaking(
            hit.object
        );

    }

}


/* =====================================================
   FINISH BREAKING
===================================================== */

function finishBreaking(
    cube
) {

    const type =
        cube.userData.type;


    /*
       Stone cannot be broken by hand.
    */

    if (
        !type.breakable
    ) {

        showMessage(
            "⛏️ You need a pickaxe to break stone!"
        );

        stopBreaking();

        return;

    }


    const parts =
        cube.userData.key
            .split(",")
            .map(Number);


    const removed =
        removeBlock(
            parts[0],
            parts[1],
            parts[2]
        );


    if (removed) {

        inventory[
            removed.id
        ]++;


        updateInventory();


        showMessage(
            "🧱 Collected " +
            removed.name +
            "!"
        );

    }


    stopBreaking();

}


/* =====================================================
   STOP BREAKING
===================================================== */

function stopBreaking() {

    breaking =
        false;

    breakingKey =
        null;

    crackMesh.visible =
        false;

    crackContext.clearRect(
        0,
        0,
        256,
        256
    );

    crackTexture.needsUpdate =
        true;

}


/* =====================================================
   BREAK / PLACE MOUSE
===================================================== */

document.addEventListener(
    "mousedown",
    event => {

        if (
            !mouseLocked
        ) {
            return;
        }


        /*
           Right click = place.
        */

        if (
            event.button === 2
        ) {

            placeBlock();

        }

    }
);


document.addEventListener(
    "mouseup",
    event => {

        /*
           Releasing left click cancels
           the breaking process.
        */

        if (
            event.button === 0
        ) {

            stopBreaking();

        }

    }
);


/* =====================================================
   BREAK UPDATE
===================================================== */

function updateBreaking() {

    if (!mouseLocked) {

        stopBreaking();

        return;

    }


    /*
       Only break while left mouse
       button is held.
    */

    if (
        !leftMouseDown
    ) {

        stopBreaking();

        return;

    }


    const hit =
        getTarget();


    if (!hit) {

        stopBreaking();

        return;

    }


    updateCrack(
        hit
    );

}


/* =====================================================
   LEFT MOUSE STATE
===================================================== */

let leftMouseDown =
    false;


document.addEventListener(
    "mousedown",
    event => {

        if (
            event.button === 0
        ) {

            leftMouseDown =
                true;

        }

    }
);


document.addEventListener(
    "mouseup",
    event => {

        if (
            event.button === 0
        ) {

            leftMouseDown =
                false;

        }

    }
);


/* =====================================================
   PLACE BLOCK
===================================================== */

function placeBlock() {

    const hit =
        getTarget();


    if (!hit) {
        return;
    }


    const type =
        blocks[
            selectedBlock
        ];


    /*
       Check inventory.
    */

    if (
        inventory[type.id] <= 0
    ) {

        showMessage(
            "You don't have any " +
            type.name +
            "!"
        );

        return;

    }


    const position =
        hit.object.position;


    const normal =
        hit.face.normal;


    const x =
        Math.floor(
            position.x +
            normal.x
        );


    const y =
        Math.floor(
            position.y +
            normal.y
        );


    const z =
        Math.floor(
            position.z +
            normal.z
        );


    /*
       Do not place a block inside
       the player.
    */

    const playerBottom =
        camera.position.y -
        EYE_HEIGHT;


    if (
        collides(
            camera.position.x,
            playerBottom,
            camera.position.z
        )
    ) {

        return;

    }


    /*
       Simple player/block check.
    */

    const playerX =
        camera.position.x;


    const playerZ =
        camera.position.z;


    if (
        playerX + PLAYER_RADIUS > x &&
        playerX - PLAYER_RADIUS < x + 1 &&
        playerZ + PLAYER_RADIUS > z &&
        playerZ - PLAYER_RADIUS < z + 1 &&
        playerBottom + PLAYER_HEIGHT > y &&
        playerBottom < y + 1
    ) {

        showMessage(
            "🚫 You cannot place a block inside yourself!"
        );

        return;

    }


    addBlock(
        x,
        y,
        z,
        type
    );


    inventory[type.id]--;

    updateInventory();


    showMessage(
        "🧱 Placed " +
        type.name
    );

}


/* =====================================================
   INVENTORY UI
===================================================== */

function updateInventory() {

    document
        .querySelectorAll(".slot")
        .forEach(
            (slot, index) => {

                const type =
                    blocks[index];


                const amount =
                    inventory[
                        type.id
                    ];


                slot
                    .querySelector(
                        ".amount"
                    )
                    .textContent =
                    amount;

            }
        );

}


/* =====================================================
   SELECT BLOCK
===================================================== */

function selectBlock(
    index
) {

    selectedBlock =
        index;


    document
        .querySelectorAll(".slot")
        .forEach(
            slot => {

                slot.classList.remove(
                    "selected"
                );

            }
        );


    const slot =
        document.querySelector(
            `.slot[data-index="${index}"]`
        );


    if (slot) {

        slot.classList.add(
            "selected"
        );

    }


    selectedName.textContent =
        blocks[index].name;

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;


function showMessage(
    text
) {

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1400
        );

}


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        /*
           Empty inventory.
        */

        Object.keys(
            inventory
        ).forEach(
            key => {

                inventory[key] =
                    0;

            }
        );


        updateInventory();

        stopBreaking();

        generateWorld();

        velocityY = 0;

        showMessage(
            "🌍 World reset!"
        );

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

generateWorld();

updateInventory();


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updatePlayer(
        delta
    );


    updateBreaking();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
