<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWorld</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ================= START SCREEN ================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            rgba(20, 80, 130, 0.75),
            rgba(20, 40, 70, 0.9)
        );
}

.startBox {
    width: min(90%, 600px);
    padding: 45px 30px;

    text-align: center;

    background: white;
    border-radius: 20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.4);
}

.startBox h1 {
    font-size: 60px;
    color: #4caf50;

    text-shadow:
        3px 3px #2e7d32;

    margin-bottom: 15px;
}

.startBox p {
    color: #555;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

#startButton {
    border: none;

    padding: 16px 55px;

    font-size: 24px;
    font-weight: bold;

    color: white;
    background: #4caf50;

    border-radius: 10px;

    cursor: pointer;

    box-shadow:
        0 6px #2e7d32;
}

#startButton:hover {
    background: #5bcf60;
}

#startButton:active {
    transform: translateY(5px);
    box-shadow: 0 1px #2e7d32;
}

/* ================= UI ================= */

#ui {
    position: fixed;
    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 20px;
    height: 20px;
}

#crosshair::before {
    content: "";

    position: absolute;

    left: 9px;
    top: 0;

    width: 2px;
    height: 20px;

    background: white;

    box-shadow: 0 0 3px black;
}

#crosshair::after {
    content: "";

    position: absolute;

    left: 0;
    top: 9px;

    width: 20px;
    height: 2px;

    background: white;

    box-shadow: 0 0 3px black;
}

#help {
    position: absolute;

    top: 15px;
    left: 15px;

    padding: 12px 16px;

    color: white;

    background: rgba(0,0,0,0.5);

    border-radius: 8px;

    font-size: 14px;

    line-height: 1.5;
}

#blockInfo {
    position: absolute;

    top: 15px;
    right: 15px;

    padding: 12px 16px;

    color: white;

    background: rgba(0,0,0,0.5);

    border-radius: 8px;
}

#message {
    position: absolute;

    top: 80px;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(-15px);

    padding: 10px 20px;

    color: white;

    background: rgba(0,0,0,0.65);

    border-radius: 20px;

    opacity: 0;

    transition: 0.25s;
}

#message.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ================= HOTBAR ================= */

#hotbar {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 5px;

    padding: 7px;

    background: rgba(0,0,0,0.5);

    border-radius: 10px;
}

.slot {
    width: 60px;
    height: 60px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    border: 3px solid #777;

    background: rgba(30,30,30,0.8);

    border-radius: 5px;
}

.slot.selected {
    border-color: white;

    box-shadow:
        0 0 0 2px #ffd54f;
}

.preview {
    width: 36px;
    height: 36px;

    border: 2px solid rgba(0,0,0,0.3);
}

.number {
    position: absolute;

    bottom: 2px;
    left: 5px;

    color: white;

    font-size: 12px;

    text-shadow:
        1px 1px 2px black;
}

/* ================= RESET ================= */

#reset {
    position: absolute;

    right: 20px;
    bottom: 105px;

    pointer-events: auto;

    padding: 9px 14px;

    border: none;

    border-radius: 7px;

    color: white;

    background: rgba(0,0,0,0.55);

    cursor: pointer;
}

#reset:hover {
    background: rgba(0,0,0,0.8);
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .startBox h1 {
        font-size: 42px;
    }

    .slot {
        width: 48px;
        height: 48px;
    }

    .preview {
        width: 28px;
        height: 28px;
    }

    #help {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ================= START SCREEN ================= -->

<div id="startScreen">

    <div class="startBox">

        <h1>BlockWorld</h1>

        <p>
            A browser-based block building game.
            <br>
            Explore, break blocks and build!
        </p>

        <button id="startButton">
            START GAME
        </button>

    </div>

</div>

<!-- ================= GAME UI ================= -->

<div id="ui">

    <div id="crosshair"></div>

    <div id="help">
        <b>Controls</b><br>
        WASD — Move<br>
        SPACE — Jump<br>
        Mouse — Look<br>
        Left Click — Break<br>
        Right Click — Place<br>
        1–5 — Select block<br>
        ESC — Release mouse
    </div>

    <div id="blockInfo">
        Selected:
        <b id="selectedName">Grass</b>
    </div>

    <div id="message">
        Block broken!
    </div>

    <button id="reset">
        Reset World
    </button>

    <div id="hotbar">

        <div class="slot selected" data-index="0">
            <div
                class="preview"
                style="background:#62b84b"
            ></div>

            <span class="number">1</span>
        </div>

        <div class="slot" data-index="1">
            <div
                class="preview"
                style="background:#8b5a2b"
            ></div>

            <span class="number">2</span>
        </div>

        <div class="slot" data-index="2">
            <div
                class="preview"
                style="background:#888"
            ></div>

            <span class="number">3</span>
        </div>

        <div class="slot" data-index="3">
            <div
                class="preview"
                style="background:#9b6b30"
            ></div>

            <span class="number">4</span>
        </div>

        <div class="slot" data-index="4">
            <div
                class="preview"
                style="background:#4c9f4c"
            ></div>

            <span class="number">5</span>
        </div>

    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   CHECK THREE.JS
===================================================== */

if (typeof THREE === "undefined") {

    alert(
        "BlockWorld could not load its 3D engine. " +
        "Please check your internet connection and reload the page."
    );

}


/* =====================================================
   VARIABLES
===================================================== */

const canvas =
    document.getElementById("game");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const message =
    document.getElementById("message");

const selectedName =
    document.getElementById("selectedName");

const blockInfo =
    document.getElementById("blockInfo");

const resetButton =
    document.getElementById("reset");


let gameStarted = false;

let selectedBlock = 0;


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        20,
        80
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        200
    );

camera.position.set(
    12,
    8,
    12
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: false
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =====================================================
   LIGHT
===================================================== */

const skyLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.8
    );

scene.add(
    skyLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

sun.position.set(
    30,
    50,
    20
);

scene.add(
    sun
);


/* =====================================================
   BLOCK TYPES
===================================================== */

const blocks = [

    {
        name: "Grass",
        color: 0x62b84b
    },

    {
        name: "Dirt",
        color: 0x8b5a2b
    },

    {
        name: "Stone",
        color: 0x888888
    },

    {
        name: "Wood",
        color: 0x9b6b30
    },

    {
        name: "Leaves",
        color: 0x4c9f4c
    }

];


/* =====================================================
   WORLD
===================================================== */

const world =
    new Map();

const meshes =
    new Map();


const SIZE = 24;


/* =====================================================
   WORLD KEY
===================================================== */

function key(
    x,
    y,
    z
) {

    return (
        x + "," +
        y + "," +
        z
    );

}


/* =====================================================
   TERRAIN
===================================================== */

function terrainHeight(
    x,
    z
) {

    return Math.max(
        1,

        Math.min(
            6,

            Math.floor(
                3
                + Math.sin(x * 0.4)
                + Math.cos(z * 0.35)
                + Math.sin(
                    (x + z) * 0.2
                )
            )
        )
    );

}


/* =====================================================
   ADD BLOCK
===================================================== */

function addBlock(
    x,
    y,
    z,
    type
) {

    const k =
        key(
            x,
            y,
            z
        );


    if (
        world.has(k)
    ) {
        return;
    }


    const geometry =
        new THREE.BoxGeometry(
            1,
            1,
            1
        );


    const material =
        new THREE.MeshLambertMaterial({
            color:
                type.color
        });


    const cube =
        new THREE.Mesh(
            geometry,
            material
        );


    cube.position.set(
        x + 0.5,
        y + 0.5,
        z + 0.5
    );


    cube.userData.key =
        k;

    cube.userData.type =
        type;


    scene.add(
        cube
    );


    world.set(
        k,
        type
    );


    meshes.set(
        k,
        cube
    );

}


/* =====================================================
   REMOVE BLOCK
===================================================== */

function removeBlock(
    x,
    y,
    z
) {

    const k =
        key(
            x,
            y,
            z
        );


    const cube =
        meshes.get(k);


    if (!cube) {
        return;
    }


    scene.remove(
        cube
    );


    cube.geometry.dispose();

    cube.material.dispose();


    meshes.delete(k);

    world.delete(k);

}


/* =====================================================
   GENERATE WORLD
===================================================== */

function generateWorld() {

    /*
       Delete old blocks.
    */

    meshes.forEach(
        cube => {

            scene.remove(
                cube
            );

            cube.geometry.dispose();

            cube.material.dispose();

        }
    );


    world.clear();

    meshes.clear();


    /*
       Terrain.
    */

    for (
        let x = 0;
        x < SIZE;
        x++
    ) {

        for (
            let z = 0;
            z < SIZE;
            z++
        ) {

            const height =
                terrainHeight(
                    x,
                    z
                );


            for (
                let y = 0;
                y <= height;
                y++
            ) {

                let type;


                if (
                    y === height
                ) {

                    type =
                        blocks[0];

                }

                else if (
                    y >= height - 2
                ) {

                    type =
                        blocks[1];

                }

                else {

                    type =
                        blocks[2];

                }


                addBlock(
                    x,
                    y,
                    z,
                    type
                );

            }

        }

    }


    /*
       Trees.
    */

    const trees = [

        [4, 5],
        [10, 8],
        [17, 5],
        [18, 15],
        [7, 18]

    ];


    trees.forEach(
        ([x, z]) => {

            const ground =
                terrainHeight(
                    x,
                    z
                );


            for (
                let y = ground + 1;
                y <= ground + 4;
                y++
            ) {

                addBlock(
                    x,
                    y,
                    z,
                    blocks[3]
                );

            }


            for (
                let dx = -2;
                dx <= 2;
                dx++
            ) {

                for (
                    let dz = -2;
                    dz <= 2;
                    dz++
                ) {

                    if (
                        Math.abs(dx) +
                        Math.abs(dz)
                        <= 3
                    ) {

                        addBlock(
                            x + dx,
                            ground + 3,
                            z + dz,
                            blocks[4]
                        );

                    }

                }

            }

        }
    );


    /*
       Player spawn.
    */

    const sx = 12;
    const sz = 12;

    camera.position.set(
        sx + 0.5,
        terrainHeight(
            sx,
            sz
        ) + 2.2,
        sz + 0.5
    );

}


/* =====================================================
   MOUSE LOOK
===================================================== */

let yaw = 0;
let pitch = 0;

let mouseLocked = false;


document.addEventListener(
    "mousemove",
    event => {

        if (
            !mouseLocked
        ) {
            return;
        }


        yaw -=
            event.movementX
            * 0.002;


        pitch -=
            event.movementY
            * 0.002;


        pitch =
            Math.max(
                -Math.PI / 2 + 0.1,
                Math.min(
                    Math.PI / 2 - 0.1,
                    pitch
                )
            );


        camera.rotation.order =
            "YXZ";


        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);


/* =====================================================
   POINTER LOCK
===================================================== */

function lockMouse() {

    document.body.requestPointerLock();

}


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement
            === document.body;

    }
);


/* =====================================================
   START GAME
===================================================== */

startButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        gameStarted = true;

        startScreen.style.display =
            "none";

        lockMouse();

    }
);


/* =====================================================
   MOVEMENT
===================================================== */

const keys = {};

let velocityY = 0;

let grounded = false;


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        if (
            event.code === "Space" &&
            grounded
        ) {

            velocityY =
                8;

            grounded =
                false;

        }


        if (
            event.code.startsWith(
                "Digit"
            )
        ) {

            const number =
                parseInt(
                    event.code.replace(
                        "Digit",
                        ""
                    )
                );


            if (
                number >= 1 &&
                number <= 5
            ) {

                selectBlock(
                    number - 1
                );

            }

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;

    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(
    delta
) {

    if (
        !gameStarted ||
        !mouseLocked
    ) {
        return;
    }


    const speed =
        5 * delta;


    const forward =
        new THREE.Vector3();


    camera.getWorldDirection(
        forward
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3(
            forward.z,
            0,
            -forward.x
        );


    const movement =
        new THREE.Vector3();


    if (
        keys["KeyW"]
    ) {

        movement.add(
            forward
        );

    }


    if (
        keys["KeyS"]
    ) {

        movement.sub(
            forward
        );

    }


    if (
        keys["KeyA"]
    ) {

        movement.sub(
            right
        );

    }


    if (
        keys["KeyD"]
    ) {

        movement.add(
            right
        );

    }


    if (
        movement.length() > 0
    ) {

        movement.normalize();

        camera.position.x +=
            movement.x * speed;

        camera.position.z +=
            movement.z * speed;

    }


    /*
       Gravity.
    */

    velocityY -=
        20 * delta;


    camera.position.y +=
        velocityY * delta;


    /*
       Ground.
    */

    const ground =
        terrainHeight(
            Math.floor(
                camera.position.x
            ),
            Math.floor(
                camera.position.z
            )
        ) + 1.8;


    if (
        camera.position.y <= ground
    ) {

        camera.position.y =
            ground;

        velocityY = 0;

        grounded = true;

    }

}


/* =====================================================
   SELECT BLOCK
===================================================== */

function selectBlock(
    index
) {

    selectedBlock =
        index;


    document
        .querySelectorAll(
            ".slot"
        )
        .forEach(
            slot => {

                slot.classList.remove(
                    "selected"
                );

            }
        );


    const slot =
        document.querySelector(
            `.slot[data-index="${index}"]`
        );


    if (slot) {

        slot.classList.add(
            "selected"
        );

    }


    selectedName.textContent =
        blocks[index].name;

}


/* =====================================================
   RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();


const center =
    new THREE.Vector2(
        0,
        0
    );


function getTarget() {

    raycaster.setFromCamera(
        center,
        camera
    );


    const objects =
        Array.from(
            meshes.values()
        );


    const hits =
        raycaster.intersectObjects(
            objects
        );


    if (
        hits.length === 0
    ) {

        return null;

    }


    if (
        hits[0].distance > 6
    ) {

        return null;

    }


    return hits[0];

}


/* =====================================================
   BREAK BLOCK
===================================================== */

function breakBlock() {

    const hit =
        getTarget();


    if (!hit) {
        return;
    }


    const parts =
        hit.object.userData
            .key
            .split(",")
            .map(Number);


    removeBlock(
        parts[0],
        parts[1],
        parts[2]
    );


    showMessage(
        "💥 Block broken!"
    );

}


/* =====================================================
   PLACE BLOCK
===================================================== */

function placeBlock() {

    const hit =
        getTarget();


    if (!hit) {
        return;
    }


    const position =
        hit.object.position;


    const normal =
        hit.face.normal;


    const x =
        Math.floor(
            position.x +
            normal.x
        );


    const y =
        Math.floor(
            position.y +
            normal.y
        );


    const z =
        Math.floor(
            position.z +
            normal.z
        );


    if (
        world.has(
            key(
                x,
                y,
                z
            )
        )
    ) {

        return;

    }


    addBlock(
        x,
        y,
        z,
        blocks[
            selectedBlock
        ]
    );


    showMessage(
        "🧱 Block placed!"
    );

}


/* =====================================================
   MOUSE CLICK
===================================================== */

document.addEventListener(
    "mousedown",
    event => {

        if (
            !gameStarted ||
            !mouseLocked
        ) {
            return;
        }


        if (
            event.button === 0
        ) {

            breakBlock();

        }


        if (
            event.button === 2
        ) {

            placeBlock();

        }

    }
);


document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;


function showMessage(
    text
) {

    message.textContent =
        text;

    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1200
        );

}


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        generateWorld();

        velocityY = 0;

        showMessage(
            "🌍 World regenerated!"
        );

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   START
===================================================== */

generateWorld();


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updatePlayer(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
